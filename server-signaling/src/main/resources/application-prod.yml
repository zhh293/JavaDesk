# prod 配置：MySQL 8 + Redis 集群（严格按开发文档 §2.4 / §9）
# 激活方式：--spring.profiles.active=prod
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DB:rc_remote}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never   # prod 请用 Flyway/Liquibase 或手动执行 schema.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

rc:
  signaling:
    node-id: ${RC_SIGNALING_NODE_ID:node-1}
    cert-file: ${RC_SIGNALING_CERT_FILE:}
    cert-password: ${RC_SIGNALING_CERT_PASSWORD:}
  security:
    jwt-secret: ${RC_JWT_SECRET}   # prod 必须注入，无默认值（启动即校验）
