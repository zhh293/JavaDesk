server:
  port: 8080

spring:
  application:
    name: rc-server-signaling
  # dev 默认：H2 内存库，零外部依赖即可自测；prod 见 application-prod.yml
  datasource:
    url: jdbc:h2:mem:rc_remote;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,SESSION;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: embedded   # 仅内嵌库自动执行 schema.sql；prod 置 never
  h2:
    console:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

# 信令长连接（Netty）与安全配置
rc:
  nacos:
    enabled: false
    server-addr: ${RC_NACOS_SERVER_ADDR:127.0.0.1:8848}
    namespace: ${RC_NACOS_NAMESPACE:public}
    username: ${RC_NACOS_USERNAME:nacos}
    password: ${RC_NACOS_PASSWORD:nacos}
    service-name: javadesk-relay
    group-name: RELAY_GROUP
  signaling:
    port: 8443
    tls: true                 # dev 无证书时自动自签
    node-id: node-1
    device-ttl-seconds: 60    # 在线设备 TTL / 读空闲判死
    heartbeat-db-flush-seconds: 30
    relay-host: 127.0.0.1     # 中继服务器地址（Phase 1 静态单节点）
    relay-port: 9090
  security:
    jwt-secret: ${RC_JWT_SECRET:rc-signaling-dev-secret-change-me-in-prod-0123456789}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
    internal-service-token: ${RC_INTERNAL_SERVICE_TOKEN:rc-internal-dev-token-change-me}
    relay-ticket-private-key: ${RC_RELAY_TICKET_PRIVATE_KEY:}
    relay-ticket-public-key: ${RC_RELAY_TICKET_PUBLIC_KEY:}
    relay-ticket-key-id: ${RC_RELAY_TICKET_KEY_ID:relay-ticket-dev-1}
    relay-ticket-issuer: ${RC_RELAY_TICKET_ISSUER:javadesk-signaling}
    relay-ticket-previous-key-id: ${RC_RELAY_TICKET_PREVIOUS_KEY_ID:}
    relay-ticket-previous-public-key: ${RC_RELAY_TICKET_PREVIOUS_PUBLIC_KEY:}
    # SSO/OIDC 登录成功后重定向回前端回调地址（仅携带 60 秒一次性交接码）
    sso-redirect-uri: ${RC_SSO_REDIRECT_URI:http://localhost:3000/sso/callback}
