worker_processes auto;
events { worker_connections 4096; }

stream {
  upstream signaling_tcp {
    least_conn;
    server signaling-1:8443 max_fails=3 fail_timeout=10s;
    server signaling-2:8443 max_fails=3 fail_timeout=10s;
  }
  server {
    listen 8443;
    proxy_connect_timeout 3s;
    proxy_timeout 1h;
    proxy_pass signaling_tcp;
  }
}

http {
  upstream signaling_http {
    least_conn;
    server signaling-1:8080 max_fails=3 fail_timeout=10s;
    server signaling-2:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }
  server {
    listen 8080;
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://signaling_http;
    }
  }
}
